name: Release Glyph Mobile

# Triggers:
#   1. Auto — on any push to main that touches package.json
#              Reads version, creates tag if new, then builds + releases
#   2. Manual — click "Run workflow" in GitHub Actions tab
#              Specify a tag or leave blank to auto-detect from package.json
on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0) — leave empty to use version in package.json'
        required: false
        type: string

jobs:
  # ── Job 1: Read version, create tag if new ───────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag:          ${{ steps.resolve.outputs.tag }}
      should_build: ${{ steps.decide.outputs.should_build }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to inspect all tags

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Resolve target tag
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v${{ steps.pkg.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Check tag and decide whether to build
        id: decide
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ℹ️  Tag $TAG already exists — updating to latest commit."
            git tag -f "$TAG"
            git push -f origin "$TAG" || true
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "✅ New version detected — creating tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  # ── Job 2: Build Android (Temporarily Disabled to Focus on iOS) ───────────────
  # build-android:
  #   needs: prepare
  #   if: false
  #   runs-on: ubuntu-latest
  #   steps: [...]

  # ── Job 3: Build iOS Simulator App Bundle (macOS) ────────────────────────────
  build-ios:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Patch Swift & C++ Compatibility
        run: node scripts/patch-swift-tools.cjs

      - name: Prebuild iOS Native Project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS Simulator App (.app)
        run: |
          cd ios
          xcodebuild -workspace Glyph.xcworkspace \
            -scheme Glyph \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package iOS Simulator Bundle
        run: |
          mkdir -p dist
          TAG="${{ needs.prepare.outputs.tag }}"
          cd ios/build/Build/Products/Release-iphonesimulator
          zip -r ../../../../../dist/Glyph-Mobile-iOS-Simulator-${TAG}.app.zip Glyph.app
          cd ../../../../..
          ls -la dist/

      - name: Publish to GitHub Releases (iOS)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist/Glyph-Mobile-iOS-Simulator-*.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
