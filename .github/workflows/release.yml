name: Release Glyph Mobile

# Triggers:
#   1. Auto — on any push to main that touches package.json
#              Reads version, creates tag if new, then builds + releases
#   2. Manual — click "Run workflow" in GitHub Actions tab
#              Specify a tag or leave blank to auto-detect from package.json
on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0) — leave empty to use version in package.json'
        required: false
        type: string

jobs:
  # ── Job 1: Read version, create tag if new ───────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag:          ${{ steps.resolve.outputs.tag }}
      should_build: ${{ steps.decide.outputs.should_build }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to inspect all tags

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Resolve target tag
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v${{ steps.pkg.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Check tag and decide whether to build
        id: decide
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ℹ️  Tag $TAG already exists — updating to latest commit."
            git tag -f "$TAG"
            git push -f origin "$TAG" || true
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "✅ New version detected — creating tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  # ── Job 2: Build Android Release (APK & AAB) ─────────────────────────────────
  build-android:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Prebuild Android Native Project
        run: npx expo prebuild --platform android --no-install

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK & AAB
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Package Android Artifacts
        run: |
          mkdir -p dist
          TAG="${{ needs.prepare.outputs.tag }}"
          
          # Copy release APK
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/Glyph-Mobile-Android-${TAG}.apk || \
          cp android/app/build/outputs/apk/release/*.apk dist/Glyph-Mobile-Android-${TAG}.apk
          
          # Copy release AAB bundle (for Google Play Store)
          cp android/app/build/outputs/bundle/release/app-release.aab dist/Glyph-Mobile-Android-${TAG}.aab || \
          cp android/app/build/outputs/bundle/release/*.aab dist/Glyph-Mobile-Android-${TAG}.aab
          
          ls -la dist/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            dist/Glyph-Mobile-Android-*.apk
            dist/Glyph-Mobile-Android-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
