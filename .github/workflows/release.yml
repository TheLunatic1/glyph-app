name: Release Glyph Mobile

# Triggers:
#   1. Auto — on any push to main that touches package.json
#              Reads version, creates tag if new, then builds + releases
#   2. Manual — click "Run workflow" in GitHub Actions tab
#              Specify a tag or leave blank to auto-detect from package.json
on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0) — leave empty to use version in package.json'
        required: false
        type: string

jobs:
  # ── Job 1: Read version, create tag if new ───────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag:          ${{ steps.resolve.outputs.tag }}
      should_build: ${{ steps.decide.outputs.should_build }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to inspect all tags

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Resolve target tag
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v${{ steps.pkg.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Check tag and decide whether to build
        id: decide
        run: |
          TAG="${{ steps.resolve.outputs.tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ℹ️  Tag $TAG already exists — updating to latest commit."
            git tag -f "$TAG"
            git push -f origin "$TAG" || true
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "✅ New version detected — creating tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  # ── Job 2: Build Android Release APK & AAB + Publish to GitHub Releases ─────────
  build-android:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Dependencies
        run: npm ci

      - name: Bundle Expo / React Native Assets
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res
          npx expo export:embed --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=2048m"

      - name: Build Android Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=2048m"
        continue-on-error: true

      - name: Prepare Android Artifacts
        run: |
          mkdir -p dist
          TAG="${{ needs.prepare.outputs.tag }}"
          # Copy release APK
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/Glyph-Mobile-Android-${TAG}.apk
          elif ls android/app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            cp android/app/build/outputs/apk/release/*.apk dist/Glyph-Mobile-Android-${TAG}.apk
          fi
          # Copy release AAB bundle
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab dist/Glyph-Mobile-Android-${TAG}.aab
          fi
          ls -la dist/

      - name: Publish to GitHub Releases (Android)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Glyph Mobile ${{ needs.prepare.outputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/Glyph-Mobile-Android-*.apk
            dist/Glyph-Mobile-Android-*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 3: Build iOS Simulator App Bundle (macOS) ────────────────────────────
  build-ios:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Patch Swift Tools Version
        run: node scripts/patch-swift-tools.cjs

      - name: Prebuild iOS Native Project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS Simulator App (.app)
        run: |
          cd ios
          xcodebuild -workspace Glyph.xcworkspace \
            -scheme Glyph \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package iOS Simulator Bundle
        run: |
          mkdir -p dist
          TAG="${{ needs.prepare.outputs.tag }}"
          cd ios/build/Build/Products/Release-iphonesimulator
          zip -r ../../../../../dist/Glyph-Mobile-iOS-Simulator-${TAG}.app.zip Glyph.app
          cd ../../../../..
          ls -la dist/

      - name: Publish to GitHub Releases (iOS)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: dist/Glyph-Mobile-iOS-Simulator-*.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
